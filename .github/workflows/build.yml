name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build standalone executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --noconsole --onefile --name CatHelper_Anya main.py
      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/CatHelper_Anya.exe')) { throw 'EXE not found' }
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CatHelper_Anya_Windows
          path: dist/CatHelper_Anya.exe
          if-no-files-found: error
